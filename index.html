<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DADINI — Crea il tuo gioiello</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..800&amp;family=Figtree:wght@400;500;600;700&amp;family=DM+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#FAF6EF;color:#16212E;font-family:'Figtree',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#16212E}a:hover{color:#2B4DAA}
*{box-sizing:border-box}
.serif{font-family:'Fraunces',Georgia,serif;font-variation-settings:'SOFT' 100}
.mono{font-family:'DM Mono',ui-monospace,monospace;text-transform:uppercase;letter-spacing:.08em}

.at{background-image:url(assets/atlas.jpg);background-size:400% 400%;background-repeat:no-repeat}
.p00{background-position:0% 0%}.p01{background-position:33.333% 0%}.p02{background-position:66.666% 0%}.p03{background-position:100% 0%}
.p10{background-position:0% 33.333%}.p11{background-position:33.333% 33.333%}.p12{background-position:66.666% 33.333%}.p13{background-position:100% 33.333%}
.p20{background-position:0% 66.666%}.p21{background-position:33.333% 66.666%}.p22{background-position:66.666% 66.666%}.p23{background-position:100% 66.666%}
.p30{background-position:0% 100%}.p31{background-position:33.333% 100%}.p32{background-position:66.666% 100%}.p33{background-position:100% 100%}
.am{background-image:url(assets/amalfi_atlas.jpg);background-size:400% 200%;background-repeat:no-repeat}
.a0{background-position:0% 0%}.a1{background-position:33.333% 0%}.a2{background-position:66.666% 0%}.a3{background-position:100% 0%}
.a4{background-position:0% 100%}.a5{background-position:33.333% 100%}.a6{background-position:66.666% 100%}.a7{background-position:100% 100%}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 26px;border-radius:999px;font-weight:700;font-size:17px;text-decoration:none;border:2px solid #16212E;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease;font-family:'Figtree',sans-serif}
.btn-ink{background:#16212E;color:#FAF6EF;box-shadow:5px 6px 0 rgba(22,33,46,.28)}
.btn-ink:hover{color:#FAF6EF;transform:translate(-2px,-2px);box-shadow:8px 9px 0 rgba(22,33,46,.28)}
.btn-ink:active{transform:translate(3px,3px);box-shadow:1px 1px 0 rgba(22,33,46,.28)}
.btn-line{background:#FAF6EF;color:#16212E}
.btn-line:hover{background:#AEC9E6;color:#16212E}
.btn-sky{background:#AEC9E6;color:#16212E;box-shadow:5px 6px 0 #16212E}
.btn-sky:hover{color:#16212E;transform:translate(-2px,-2px);box-shadow:8px 9px 0 #16212E}
.btn-sky:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #16212E}

.word{display:inline-block;white-space:nowrap;margin-right:.22em}
.ch{display:inline-block;animation:rise .9s cubic-bezier(.2,.9,.25,1.25) both}
.ch-it{font-style:italic;font-weight:500}
@keyframes rise{from{opacity:0;transform:translateY(70%) rotate(8deg) scale(.9)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-14px) rotate(var(--r,0deg))}}
@keyframes turn{to{transform:rotate(360deg)}}
.bob{animation:bob 5s ease-in-out infinite}
.turn{animation:turn 16s linear infinite}
.marq{display:flex;width:max-content;animation:marq 34s linear infinite}
.marq-rev{animation-direction:reverse;animation-duration:40s}
@keyframes marq{to{transform:translateX(-50%)}}

.stage{position:relative;overflow:hidden;user-select:none}
@media (min-width: 1000px){.stick{position:sticky;top:88px}}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.stage canvas:active{cursor:grabbing}

.chip{position:relative;width:56px;height:56px;border-radius:14px;border:2px solid rgba(22,33,46,.16);background:#fff;padding:4px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:transform .15s,border-color .15s;flex:0 0 auto}
.chip:hover{transform:translateY(-3px)}
.chip-on{border-color:#16212E;box-shadow:3px 3px 0 #16212E}
.chip-sm{width:38px}
.thumb{display:block;width:100%;height:100%;border-radius:9px;background-color:#fff}
.stopi{display:block;width:16px;height:30px;border-radius:5px}
.beadi{display:block;width:16px;height:16px;border-radius:50%}
.mot{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;border-radius:16px;border:2px solid transparent;background:transparent;cursor:pointer;font:600 12px/1.2 'Figtree',sans-serif;color:#16212E;text-align:center;transition:transform .15s}
.mot:hover{transform:translateY(-3px) rotate(-2deg)}
.mot .thumb{width:60px;height:60px;border-radius:12px;box-shadow:0 2px 0 rgba(22,33,46,.15),inset 0 0 0 1px rgba(22,33,46,.08)}
.mot-on{border-color:#16212E;background:#fff}
.sw{width:42px;height:42px;border-radius:50%;border:3px solid #FAF6EF;box-shadow:0 0 0 2px rgba(22,33,46,.15);cursor:pointer;transition:transform .15s}
.sw:hover{transform:scale(1.1)}
.sw-on{box-shadow:0 0 0 3px #16212E}
.pill{min-height:44px;padding:0 16px;border-radius:999px;border:2px solid rgba(22,33,46,.18);background:#fff;font:600 14px 'Figtree',sans-serif;color:#16212E;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.pill:hover{border-color:#16212E}
.pill-on{background:#16212E;color:#FAF6EF;border-color:#16212E}
.pill-off{opacity:.38;cursor:not-allowed;text-decoration:line-through}
.pill small{font:500 11px 'DM Mono',monospace;opacity:.75}
.pill:disabled{opacity:.35;cursor:not-allowed}
.tab{min-height:40px;padding:0 14px;border-radius:999px;border:0;background:transparent;font:600 13px 'Figtree',sans-serif;color:#4A5462;cursor:pointer;white-space:nowrap}
.tab-on{background:#16212E;color:#FAF6EF}
.mini{min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid rgba(22,33,46,.25);background:rgba(250,246,239,.9);font:500 12px 'DM Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:#16212E;cursor:pointer}
.mini-on{background:#16212E;color:#FAF6EF}
.round{width:44px;height:44px;border-radius:50%;border:2px solid #16212E;background:#FAF6EF;font:700 22px 'Figtree',sans-serif;color:#16212E;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.round:hover{background:#AEC9E6}

.card{position:relative;width:170px;height:238px;perspective:900px}
.flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.3,.4,1)}
.flipped{transform:rotateY(180deg)}
.side{position:absolute;inset:0;border-radius:24px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid #16212E;overflow:hidden}
.front{display:flex;flex-direction:column;justify-content:flex-start;padding:0;cursor:pointer;background:#fff;text-align:left;font:inherit;color:inherit;width:100%;height:100%}
.back{transform:rotateY(180deg);color:#FAF6EF;padding:14px;display:flex;flex-direction:column;justify-content:space-between}
.back::before{content:"";position:absolute;inset:0;background:rgba(22,33,46,.84)}
.back > *,.back > dc-g > *{position:relative}
.flipped .front{pointer-events:none}
.flip:not(.flipped) .back{pointer-events:none}
.card:hover .flip:not(.flipped){transform:rotateY(-8deg) rotateX(4deg)}

@supports (animation-timeline: view()){
  .reveal{animation:reveal linear both;animation-timeline:view();animation-range:entry 0% cover 28%}
  @keyframes reveal{from{opacity:0;transform:translateY(60px) scale(.97)}to{opacity:1;transform:none}}
  @property --num{syntax:'<integer>';initial-value:0;inherits:false}
  .count{counter-reset:num var(--num);animation:count linear both;animation-timeline:view();animation-range:entry 10% cover 45%}
  .count::after{content:counter(num)}
  .count .fallback{display:none}
  @keyframes count{from{--num:0}to{--num:24}}
}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #2B4DAA;outline-offset:3px}
@media (prefers-reduced-motion: reduce){.ch,.bob,.turn,.marq{animation:none}}
/* configurator v3 */
.lbl{margin:0 0 10px;font:500 11px 'DM Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#4A5462}
.step{display:flex;align-items:center;gap:10px;padding:14px 12px;border:0;border-right:1.5px solid rgba(22,33,46,.12);background:#fff;cursor:pointer;text-align:left;font:inherit;color:#16212E;min-width:0}
.step:last-child{border-right:0}
.step-n{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:2px solid #16212E;display:inline-flex;align-items:center;justify-content:center;font:700 14px 'Figtree',sans-serif}
.step-sub{font-size:10px;color:#4A5462;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.step-on{background:#16212E;color:#FAF6EF}
.step-on .step-n{background:#AEC9E6;color:#16212E;border-color:#AEC9E6}
.step-on .step-sub{color:#C9CFD8}
.step-done .step-n{background:#16212E;color:#FAF6EF}
.bcard{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:12px;border-radius:18px;border:2px solid rgba(22,33,46,.15);background:#fff;cursor:pointer;text-align:left;font:inherit;color:#16212E;min-width:0}
.bcard:hover{border-color:#16212E}
.bcard-on{border-color:#16212E;box-shadow:4px 4px 0 #16212E}
.bcard-v{display:block;width:100%;height:28px;border-radius:999px}
.lcard{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px;border-radius:16px;border:2px solid rgba(22,33,46,.15);background:#fff;cursor:pointer;text-align:left;font:inherit;color:#16212E;min-width:0}
.lcard:hover{border-color:#16212E}
.lcard-on{border-color:#16212E;background:#EEF4FA}
.lpat{font:500 12px 'DM Mono',monospace;letter-spacing:.02em;color:#2B4DAA}
.mrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;border:1.5px solid rgba(22,33,46,.15)}
.mnum{min-width:22px;text-align:center;font-size:18px}
.round-sm{width:40px;height:40px;font-size:18px}
.round:disabled{opacity:.3;cursor:not-allowed}
.linkbtn{border:0;background:none;padding:4px 0;font:600 13px 'Figtree',sans-serif;color:#2B4DAA;cursor:pointer;text-decoration:underline}
.track{position:relative;overflow-x:auto;scrollbar-width:thin}
.track-inner{position:relative;display:flex;align-items:center;gap:3px;min-width:max-content;padding:14px 6px 12px}
.track-line{position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;border-radius:2px;opacity:.85}
.ti{position:relative;flex:0 0 auto;border:0;background:none;padding:4px 1px;cursor:pointer;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;min-width:24px;min-height:52px}
.ti-n{position:absolute;top:-2px;left:50%;transform:translateX(-50%);font:500 8px 'DM Mono',monospace;color:#4A5462;pointer-events:none}
.ti-drag{opacity:.4}
.ti-target{box-shadow:inset 0 0 0 2px #E8A33D;background:rgba(232,163,61,.12)}
.pill-on{background:#2B4DAA;color:#FAF6EF}
.ti-on{background:rgba(43,77,170,.14);box-shadow:inset 0 0 0 2px #2B4DAA}
.ti-d{display:block;width:40px;height:40px;border-radius:7px;box-shadow:0 2px 0 rgba(22,33,46,.25),inset 0 0 0 1px rgba(22,33,46,.12)}
.ti-s{display:block;width:16px;height:30px;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.ti-b{display:block;width:15px;height:15px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.tile{position:relative;border-radius:18px;border:2px solid rgba(22,33,46,.12);background:#fff;transition:border-color .15s}
.tile:hover{border-color:#16212E}
.tile-on{border-color:#2B4DAA;background:#EEF4FA}
.tile-main{width:100%;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 6px 10px;border:0;background:none;cursor:pointer;font:inherit;color:#16212E;text-align:center}
.tile-add{position:absolute;right:6px;top:6px;width:32px;height:32px;border-radius:50%;border:2px solid #16212E;background:#AEC9E6;font:700 18px 'Figtree',sans-serif;color:#16212E;cursor:pointer;line-height:1}
.tile-add:hover{background:#16212E;color:#FAF6EF}
.tile-add:disabled{opacity:.3;cursor:not-allowed}
.tile-badge{position:absolute;left:8px;top:8px;padding:2px 7px;border-radius:999px;background:#16212E;color:#FAF6EF;font:500 10px 'DM Mono',monospace}
.cube-wrap{display:block;width:76px;height:76px;perspective:320px;margin:4px 0 6px}
.cube{position:relative;display:block;width:56px;height:56px;margin:10px;transform-style:preserve-3d;transform:rotateX(-16deg) rotateY(-24deg);transition:transform .4s}
.cf{position:absolute;inset:0;display:block;border-radius:5px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:inset 0 0 0 1px rgba(22,33,46,.12)}
.c-f{transform:translateZ(28px)}
.c-r{transform:rotateY(90deg) translateZ(28px);filter:brightness(.88)}
.c-b{transform:rotateY(180deg) translateZ(28px)}
.c-l{transform:rotateY(-90deg) translateZ(28px);filter:brightness(.88)}
.c-t{transform:rotateX(90deg) translateZ(28px);background:radial-gradient(circle,#2a241d 0 5px,#d9d1c2 6px 8px,#fbf8f2 9px)}
.tile:hover .cube,.tile:focus-within .cube,.tile-on .cube{animation:cubespin 3.2s linear infinite}
@keyframes cubespin{from{transform:rotateX(-16deg) rotateY(-24deg)}to{transform:rotateX(-16deg) rotateY(336deg)}}
@media (prefers-reduced-motion: reduce){.tile:hover .cube,.tile-on .cube{animation:none}}
</style>

<style>dc-g{display:contents}</style>
<script src="assets/three.min.js"></script>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">

<div style="background: #FAF6EF; overflow-x: hidden">

<header style="position: sticky; top: 0; z-index: 50; background: rgba(250,246,239,.84); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1.5px solid rgba(22,33,46,.1)">
  <nav style="max-width: 1280px; margin: 0 auto; padding: 14px clamp(16px, 4vw, 40px); display: flex; align-items: center; gap: 24px; flex-wrap: wrap">
    <a href="#top" aria-label="DADINI" style="display: flex; align-items: center; text-decoration: none; color: #16212E">
      <sc-if value="{{logoOk}}" hint-placeholder-val="{{ true }}"><img src="assets/dadini-logo.svg" alt="DADINI" style="height: 62px; width: auto; display: block"></sc-if>
      <sc-if value="{{logoFail}}" hint-placeholder-val="{{ false }}"><span class="serif" style="font-size: 27px; font-weight: 700; letter-spacing: .04em">DADINI</span></sc-if>
    </a>
    <div style="display: flex; gap: 22px; flex-wrap: wrap; margin-left: auto; align-items: center; font-weight: 600; font-size: 15px">
      <a href="#configura" style="text-decoration: none">Configura</a>
      <a href="#collezioni" style="text-decoration: none">Collezioni</a>
      <a href="#come" style="text-decoration: none">Come funziona</a>
      <a href="#basi" style="text-decoration: none">Basi</a>
    </div>
    <a href="#configura" class="btn btn-ink" style="min-height: 44px; font-size: 15px; padding: 0 20px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l-1 13H7L6 7Z"></path><path d="M9 7a3 3 0 0 1 6 0"></path></svg>
      Carrello · {{cartCount}}
    </a>
  </nav>
</header>

<section id="top" style="max-width: 1280px; margin: 0 auto; padding: clamp(40px, 6vw, 80px) clamp(16px, 4vw, 40px) 60px; display: flex; flex-wrap: wrap; gap: 48px; align-items: center">
  <div style="flex: 1 1 520px; min-width: 0">
    <p class="mono" style="margin: 0 0 22px; font-size: 13px; display: inline-flex; align-items: center; gap: 10px; padding: 8px 14px; border: 1.5px solid #16212E; border-radius: 999px; background: #fff">
      <span style="width: 8px; height: 8px; border-radius: 50%; background: #D93A2F"></span>Mediterraneo · Amalfi Coast · Colors
    </p>
    <h1 class="serif" style="margin: 0; font-size: clamp(54px, 7.8vw, 124px); line-height: .92; letter-spacing: -0.035em; font-weight: 700">
      <sc-for list="{{heroWords}}" as="w" hint-placeholder-count="4">
        <span class="word"><sc-for list="{{w.letters}}" as="l" hint-placeholder-count="6"><span class="{{l.cls}}" style="animation-delay: {{l.d}}ms; color: {{l.color}}">{{l.ch}}</span></sc-for></span>
      </sc-for>
    </h1>
    <p style="margin: 28px 0 0; font-size: clamp(18px, 1.6vw, 21px); line-height: 1.5; max-width: 540px; color: #3B4552">Colori, maioliche, decori. I Dadini in porcellana impreziosiscono il tuo stile: crea il tuo gioiello, componi la sequenza e girala in 3D prima di indossarla.</p>
    <div style="display: flex; flex-wrap: wrap; gap: 16px; margin-top: 34px">
      <a href="#configura" class="btn btn-ink">Crea il tuo gioiello
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </a>
      <a href="#collezioni" class="btn btn-line">Scopri le collezioni</a>
    </div>
    <ul style="list-style: none; padding: 0; margin: 34px 0 0; display: flex; flex-wrap: wrap; gap: 10px 28px; font-size: 15px; font-weight: 600">
      <li style="display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2B4DAA" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Dadini da 19 €</li>
      <li style="display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2B4DAA" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Basi da 10 €</li>
      <li style="display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2B4DAA" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Sequenza libera</li>
    </ul>
  </div>

  <div style="flex: 1 1 420px; min-width: 0; position: relative">
    <div style="position: relative; aspect-ratio: 1 / 1; border-radius: 40px; background: #DCE8F5; border: 2px solid #16212E; box-shadow: 10px 12px 0 #16212E; overflow: hidden">
      <img src="assets/bracciale.jpg" alt="Bracciale DADINI con cordino azzurro, un dadino in maiolica blu e perline dorate" style="width: 100%; height: 100%; object-fit: cover; mix-blend-mode: multiply; transform: scale(1.08) rotate(-6deg)">
    </div>
    <div class="bob" style="position: absolute; left: -26px; top: 12%; display: flex; align-items: center; gap: 10px; padding: 10px 16px 10px 10px; background: #fff; border: 2px solid #16212E; border-radius: 18px; box-shadow: 4px 5px 0 #16212E; --r: -4deg">
      <span class="am a1" style="width: 44px; height: 44px; border-radius: 10px; display: block"></span>
      <span style="display: flex; flex-direction: column"><strong style="font-size: 15px">Positano</strong><span class="mono" style="font-size: 11px; color: #4A5462">Amalfi Coast · 24,00 €</span></span>
    </div>
    <div class="bob" style="position: absolute; right: -14px; bottom: 16%; display: flex; gap: 8px; padding: 10px; background: #FAF6EF; border: 2px solid #16212E; border-radius: 18px; box-shadow: 4px 5px 0 #16212E; animation-delay: -2s; --r: 5deg">
      <span class="at p23" style="width: 38px; height: 38px; border-radius: 8px; display: block"></span>
      <span class="am a5" style="width: 38px; height: 38px; border-radius: 8px; display: block"></span>
      <span class="at p11" style="width: 38px; height: 38px; border-radius: 8px; display: block"></span>
    </div>
    <div style="position: absolute; right: 6%; top: -34px; width: 132px; height: 132px; border-radius: 50%; background: #D93A2F; color: #FAF6EF; border: 2px solid #16212E; display: flex; align-items: center; justify-content: center">
      <svg class="turn" width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="Componi, indossa, regala">
        <defs><path id="circ" d="M60 60 m-44 0 a44 44 0 1 1 88 0 a44 44 0 1 1 -88 0"></path></defs>
        <text font-family="DM Mono, monospace" font-size="11.5" letter-spacing="2.6" fill="#FAF6EF"><textPath href="#circ">COMPONI · INDOSSA · REGALA ·</textPath></text>
      </svg>
      <span class="serif" style="position: absolute; font-size: 34px; font-style: italic; font-weight: 600">d</span>
    </div>
  </div>
</section>

<div aria-hidden="true" style="position: relative; padding: 30px 0 50px">
  <div style="background: #2B4DAA; color: #FAF6EF; transform: rotate(-2deg); border-top: 2px solid #16212E; border-bottom: 2px solid #16212E; overflow: hidden; padding: 14px 0">
    <div class="marq serif" style="font-size: 38px; font-style: italic; font-weight: 500; gap: 40px; white-space: nowrap">
      <span>Amalfi ●</span><span>Positano ●</span><span>Ravello ●</span><span>Cetara ●</span><span>Praiano ●</span><span>Vietri sul Mare ●</span><span>Atrani ●</span><span>Conca dei Marini ●</span>

<section id="configura" style="max-width: 1320px; margin: 0 auto; padding: 50px clamp(16px, 4vw, 40px) 80px">

      <p class="mono" style="margin: 0 0 12px; font-size: 13px; color: #4A5462">Crea il tuo gioiello DADINI</p>

    <p style="margin: 0; max-width: 400px; font-size: 17px; line-height: 1.5; color: #3B4552">Scegli la base, poi i dadini da qualsiasi collezione, infine blocca ed esalta il design con Stop! e Beads. Il 3D racconta ogni tua scelta.</p>
  </div>

  <div style="display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start">
    <div class="stick" style="flex: 1.25 1 540px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
      <div class="stage" style="height: clamp(400px, 56vh, 600px); border-radius: 36px; border: 2px solid #16212E; background: radial-gradient(110% 85% at 50% 25%, #FFFFFF 0%, #EEF4FA 40%, #CFE0F1 78%, #AEC9E6 100%)">
        <canvas data-dadini3d="1" ref="{{canvasRef}}" aria-label="Anteprima 3D del bracciale: trascina per ruotare" role="img"></canvas>

        <div style="position: absolute; left: 16px; top: 16px; display: flex; gap: 6px; padding: 4px; border-radius: 999px; background: rgba(250,246,239,.92); border: 1.5px solid rgba(22,33,46,.2)">
          <button type="button" class="tab {{modeBr}}" onClick="{{toBracelet}}">Bracciale</button>
          <button type="button" class="tab {{modeDa}}" onClick="{{toDadino}}">Dadino singolo</button>
        </div>
        <div style="position: absolute; right: 16px; top: 16px; display: flex; flex-direction: column; gap: 8px">
          <button type="button" class="round" onClick="{{zoomIn}}" aria-label="Avvicina">+</button>
          <button type="button" class="round" onClick="{{zoomOut}}" aria-label="Allontana">−</button>
        </div>
        <sc-if value="{{isDadinoMode}}" hint-placeholder-val="{{ false }}">
          <div style="position: absolute; left: 16px; top: 76px; padding: 10px 14px; border-radius: 16px; background: rgba(250,246,239,.95); border: 1.5px solid rgba(22,33,46,.2); max-width: 250px">
            <p class="mono" style="margin: 0; font-size: 10px; color: #4A5462">{{inspectColl}}</p>
            <p class="serif" style="margin: 4px 0 0; font-size: 22px; font-weight: 700; line-height: 1.05">{{inspectName}}</p>
            <sc-if value="{{isPreview}}" hint-placeholder-val="{{ false }}">
              <p class="mono" style="margin: 6px 0 8px; font-size: 10px; color: #D93A2F">Anteprima · non ancora nel bracciale</p>
              <button type="button" class="pill pill-on" onClick="{{addPreview}}" disabled="{{noAddD}}">+ Aggiungi al bracciale</button>
            </sc-if>
          </div>
        </sc-if>
        <div style="position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center">
          <sc-if value="{{isDadinoMode}}" hint-placeholder-val="{{ false }}">
            <sc-for list="{{faces}}" as="f" hint-placeholder-count="5">
              <button type="button" class="mini {{f.on}}" onClick="{{f.pick}}">{{f.name}}</button>
            </sc-for>
          </sc-if>
          <button type="button" class="mini {{autoOn}}" aria-pressed="{{auto}}" onClick="{{toggleAuto}}">Rotazione auto</button>
        </div>
        <sc-if value="{{noWebgl}}" hint-placeholder-val="{{ false }}">
          <p style="position: absolute; inset: 0; margin: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 40px; font-weight: 600; pointer-events: none">Caricamento del 3D…</p>
        </sc-if>
      </div>

      <div style="background: #fff; border: 2px solid #16212E; border-radius: 28px; padding: 16px 18px">
        <div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px">
          <h3 style="margin: 0; font-size: 17px; font-weight: 700">La tua sequenza</h3>
          <span class="mono" style="font-size: 11px; color: #4A5462">{{seqCount}}</span>
        </div>
        <div class="track"><div class="track-inner">
          <div class="track-line" style="background: {{trackColor}}"></div>
          <sc-for list="{{seqChips}}" as="sq" hint-placeholder-count="7">
            <button type="button" class="ti {{sq.cls}}" onClick="{{sq.pick}}" aria-label="{{sq.label}}" data-i="{{sq.i}}">
              <span class="ti-n">{{sq.n}}</span>
              <sc-if value="{{sq.isD}}" hint-placeholder-val="{{ true }}"><span class="ti-d {{sq.thumb}}" style="background-color: {{sq.col}}"></span></sc-if>
              <sc-if value="{{sq.isStop}}" hint-placeholder-val="{{ false }}"><span class="ti-s" style="background: {{sq.mc}}"></span></sc-if>
              <sc-if value="{{sq.isBead}}" hint-placeholder-val="{{ false }}"><span class="ti-b" style="background: {{sq.mc}}"></span></sc-if>
            </button>
          </sc-for>
        </div></div>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 4px">
          <span style="font-size: 14px; font-weight: 600; margin-right: auto">{{selLabel}}</span>
          <button type="button" class="{{moveBtnCls}}" style="min-height: 38px" onClick="{{moveToggle}}">{{moveBtn}}</button>
          <button type="button" class="round round-sm" onClick="{{moveLeft}}" disabled="{{noLeft}}" aria-label="Sposta a sinistra">←</button>
          <button type="button" class="round round-sm" onClick="{{moveRight}}" disabled="{{noRight}}" aria-label="Sposta a destra">→</button>
          <button type="button" class="round round-sm" onClick="{{removeSel}}" disabled="{{noRemove}}" aria-label="Togli dal bracciale">×</button>
          <sc-if value="{{selIsD}}" hint-placeholder-val="{{ true }}">
            <button type="button" class="pill" style="min-height: 38px" onClick="{{inspectSel}}">Guarda le facce</button>
          </sc-if>
        </div>
        <p class="mono" style="margin: 10px 0 0; font-size: 10px; color: #4A5462">{{seqHint}}</p>
      </div>
    </div>

    <div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; background: #fff; border: 2px solid #16212E; border-radius: 36px; box-shadow: 8px 10px 0 rgba(22,33,46,.12); overflow: hidden">

      <div style="padding: clamp(20px, 3vw, 30px); display: flex; flex-direction: column; gap: 22px">

                    <strong style="font-size: 15px">{{ba.name}}</strong>

              </div>
            </div>
            <div>
              <p class="lbl">Colore · {{colorName}}</p>
              <div style="display: flex; flex-wrap: wrap; gap: 10px">
                <sc-for list="{{colors}}" as="c" hint-placeholder-count="6">
                  <button type="button" class="sw {{c.on}}" style="background: {{c.hex}}" onClick="{{c.pick}}" aria-label="{{c.name}}"></button>
                </sc-for>
              </div>
            </div>
            <sc-if value="{{isSnake}}" hint-placeholder-val="{{ false }}">

                  <sc-for list="{{metals}}" as="me" hint-placeholder-count="2">
                    <button type="button" class="pill {{me.on}}" aria-disabled="{{me.disabled}}" onClick="{{me.pick}}"><span style="width: 20px; height: 20px; border-radius: 50%; display: inline-block; border: 1.5px solid rgba(22,33,46,.3); background: {{me.bg}}"></span>{{me.name}} <small>{{me.note}}</small></button>
                  </sc-for>
                </div>
              </div>
            </sc-if>
            <button type="button" class="btn btn-ink" style="align-self: flex-start" onClick="{{goStep2}}">Avanti: scegli i dadini →</button>

        <sc-if value="{{step2}}" hint-placeholder-val="{{ false }}">

            <p class="mono" style="margin: 0; font-size: 11px; color: #4A5462">{{dCount}} · passa sopra a un dadino per vederlo girare, toccalo per l'anteprima 3D</p>
            <div class="cat">

                  <button type="button" class="tile-main" onClick="{{ct.preview}}" aria-label="{{ct.aria}}">

                      <span class="cube">
                        <span class="cf c-f {{ct.f1}}" style="background-color: {{ct.col}}"></span>
                        <span class="cf c-r {{ct.f2}}" style="background-color: {{ct.col}}"></span>
                        <span class="cf c-b {{ct.f3}}" style="background-color: {{ct.col}}"></span>
                        <span class="cf c-l {{ct.f4}}" style="background-color: {{ct.col}}"></span>
                        <span class="cf c-t"></span>
                      </span>
                    </span>
                    <span style="font-size: 13px; font-weight: 700; line-height: 1.2">{{ct.name}}</span>
                    <span class="mono" style="font-size: 10px; color: #4A5462">{{ct.sub}}</span>
                  </button>
                  <button type="button" class="tile-add" onClick="{{ct.add}}" disabled="{{noAddD}}" aria-label="{{ct.addAria}}">+</button>

            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 10px">
              <button type="button" class="btn btn-line" style="min-height: 46px" onClick="{{goStep1}}">← Bracciale</button>
              <button type="button" class="btn btn-ink" style="min-height: 46px" onClick="{{goStep3}}">Avanti: blocca ed esalta →</button>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{step3}}" hint-placeholder-val="{{ false }}">

              <div style="display: flex; flex-wrap: wrap; gap: 8px">
                <sc-for list="{{metals}}" as="me" hint-placeholder-count="2">
                  <button type="button" class="pill {{me.on}}" aria-disabled="{{me.disabled}}" onClick="{{me.pick}}"><span style="width: 20px; height: 20px; border-radius: 50%; display: inline-block; border: 1.5px solid rgba(22,33,46,.3); background: {{me.bg}}"></span>{{me.name}} <small>{{me.note}}</small></button>

              <button type="button" class="round round-sm" onClick="{{beadPlus}}" disabled="{{noMetalPlus}}" aria-label="Più Beads">+</button>

              <p class="lbl">Riordina in un tocco</p>
              <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">

                    <span class="lpat">{{ly.pat}}</span>
                    <strong style="font-size: 14px">{{ly.name}}</strong>
                    <span style="font-size: 12px; color: #4A5462; line-height: 1.3">{{ly.desc}}</span>
                  </button>
                </sc-for>
              </div>
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 14px; border-radius: 16px; background: #EEF4FA">

              <button type="button" class="pill" onClick="{{insStop}}" disabled="{{noMetalPlus}}">+ Stop!</button>
              <button type="button" class="pill" onClick="{{insBead}}" disabled="{{noMetalPlus}}">+ Bead</button>
            </div>
            <button type="button" class="btn btn-line" style="min-height: 46px; align-self: flex-start" onClick="{{goStep2}}">← Dadini</button>
          </div>
        </sc-if>
      </div>

      <div style="margin-top: auto; border-top: 2px solid #16212E; background: #FAF6EF; padding: 18px clamp(20px, 3vw, 30px)">
        <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px">
          <div>
            <p class="serif" style="margin: 0; font-size: 40px; font-weight: 700; letter-spacing: -0.02em; line-height: 1">{{total}}</p>
            <button type="button" class="linkbtn" onClick="{{toggleLines}}" aria-expanded="{{showLines}}">{{linesLabel}}</button>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 10px">
            <button type="button" class="btn btn-line" style="min-height: 48px" onClick="{{addToCart}}">Carrello</button>
            <button type="button" class="btn btn-sky" style="min-height: 48px" onClick="{{openOrder}}">Invia ordine</button>
          </div>
        </div>
        <sc-if value="{{showLines}}" hint-placeholder-val="{{ false }}">
          <ul style="list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px">
            <sc-for list="{{lines}}" as="li" hint-placeholder-count="3">
              <li style="display: flex; justify-content: space-between; gap: 12px"><span>{{li.label}}</span><span class="mono" style="font-size: 12px; white-space: nowrap">{{li.price}}</span></li>

            <p class="lbl" style="margin-bottom: 8px">Sequenza da infilare · da sinistra a destra</p>
            <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px">

                  <span class="mono" style="width: 26px; font-size: 12px; color: #4A5462">{{o.n}}</span>

                  <sc-if value="{{o.isStop}}" hint-placeholder-val="{{ false }}"><span style="width: 30px; display: inline-flex; justify-content: center"><span class="ti-s" style="width: 12px; height: 24px; background: {{o.mc}}"></span></span></sc-if>

              <input type="text" value="{{orderName}}" onInput="{{setOrderName}}" placeholder="Il tuo nome" style="min-height: 46px; border-radius: 14px; border: 2px solid rgba(22,33,46,.2); padding: 0 14px; font: 500 16px 'Figtree', sans-serif; background: #fff; color: #16212E">

            <label style="display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 14px">Note

            <span class="lbl" style="margin: 0">Totale</span>
            <span class="serif" style="font-size: 36px; font-weight: 700">{{total}}</span>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 10px">

          </div>
          <p class="mono" style="margin: 0; font-size: 10px; color: #4A5462">{{orderStatus}}</p>

      // gallery
      galTabs: [{ id: 'med', name: 'Mediterraneo' }, { id: 'ama', name: 'Amalfi Coast' }].map(function (t) {
        return { name: t.name, on: st.gtab === t.id ? 'tab-on' : '', pick: function () { self.setState({ gtab: t.id, flipped: {} }); } };
      }),
      galKicker: st.gtab === 'med' ? 'DADINI Mediterraneo · 8 dadini · 24,00 €' : 'DADINI Amalfi Coast · 8 dadini · 24,00 €',
      galTitleA: st.gtab === 'med' ? "L'estate" : 'La Costiera',
      galTitleB: st.gtab === 'med' ? 'in un quadrato.' : 'paese per paese.',
      galIntro: st.gtab === 'med'
        ? 'Illustrazioni rosso e blu, simboli marini e dettagli d’atelier: piccoli talismani di spensieratezza da indossare da soli o mixati tra loro.'
        : 'Ogni dadino è una maiolica con impresso il decoro del paese che lo rappresenta, da Amalfi a Vietri sul Mare.',
      gallery: gal.map(function (m) {
        var f = !!st.flipped[m.id];
        return {
          name: m.name, story: m.story, front: m.front, back: m.back, kicker: m.kicker,
          aria: 'Gira il dadino ' + m.name, flipCls: f ? 'flipped' : '',
          flip: function () { var o = Object.assign({}, self.state.flipped); o[m.id] = !o[m.id]; self.setState({ flipped: o }); },
          use: function () {
            self.addDadinoKey(m.id);
            self.setState({ coll: m.id.split(':')[0], mode: 'bracelet', prev: null });
          }
        };
      }),
      subscribed: st.subscribed,
      subscribe: function (e) { e.preventDefault(); self.setState({ subscribed: true }); }
    };
  }
}

window.addEventListener('DOMContentLoaded', function () {
  window.__dc = dcMount(Component, document.getElementById('dc-root'), document.getElementById('dc-tpl'), { autoRotate: true });
});
</script>
</body>
</html>
